function render(){const page=state.page;$('#screen').innerHTML=({home:home,detail:detail,checkout:checkout,orders:orders})[page]();$('#status').className='status '+(page==='home'?'home-status':page==='detail'?'detail-status':'');$('#steps').innerHTML=[['home','发现合拍的搭子'],['detail','了解 TA 的实力'],['checkout','预约这一局'],['orders','快乐开黑，留下好评']].map(([key,label],i)=>`<button class="step ${key===page?'active':''}" data-go="${key}" ${key===page?'aria-current="step"':''}><b>0${i+1}</b><span>${label}</span></button>`).join('');document.title=({home:'找陪玩',detail:selectedPerson().name+' · 陪玩详情',checkout:'确认订单',orders:'我的订单'})[page]+' · 一起开黑'}
function go(page,push=true){stopVoice();if($('#dialog').open)$('#dialog').close();state.page=page;if(push&&location.hash!=='#'+page)history.pushState({page},'', '#'+page);render();window.scrollTo({top:0,behavior:'instant'});const title=$('#page-title');if(title)title.focus({preventScroll:true})}
function home(){return `<section class="page home-page"><div class="home-hero"><div class="between"><h1 id="page-title" tabindex="-1">找陪玩</h1><button class="notification" aria-label="查看通知" data-action="notifications">${icon('bell')}</button></div><label class="search">${icon('search')}<input id="search" aria-label="搜索游戏或陪玩昵称" placeholder="搜索你想玩的游戏" value="${esc(state.search)}" type="search" autocomplete="off"></label><nav class="categories" aria-label="游戏分类">${['全部','王者荣耀','英雄联盟','和平精英','蛋仔派对','语音聊天'].map(c=>`<button data-category="${c}" class="chip ${state.category===c?'active':''}" aria-pressed="${state.category===c}">${c}</button>`).join('')}</nav></div><div class="home-content"><div class="promo"><strong>新人首单 <small>立减</small><em>10</em><small>元</small></strong><button data-action="claim">${state.claimed?'已领取 ✓':'领券 ›'}</button></div><section class="rank card"><div class="between"><h3>本周人气榜</h3><button class="rank-more" data-action="rank">查看榜单 ›</button></div><div class="rank-list">${people.slice(0,3).map((p,i)=>`<button class="rank-person" data-person="${p.id}" aria-label="查看人气榜第${i+1}名${p.name}"><span class="medal">${i+1}</span>${avatar(p)}<strong>${p.name}</strong><p class="small">${p.heat} 热度</p></button>`).join('')}</div></section><div class="companions" id="companions">${companionCards()}</div><p class="small muted" style="text-align:center;margin-top:15px;font-size:10px">实名认证 · 安心开黑 · 以上为演示资料</p></div>${nav('home')}</section>`}
function companionCards(){const list=people.filter(p=>(state.category==='全部'||p.game===state.category)&&(!state.search||[p.name,p.game,...p.tags].join(' ').includes(state.search)));return list.length?list.map(p=>`<button class="companion" data-person="${p.id}" aria-label="查看${p.name}，${p.game}，每局${p.price}元"><span class="online">在线</span>${avatar(p)}<h3>${p.name} ${verified()}</h3><div class="between score-row"><b><span class="gold">★</span> ${p.rating}</b><span class="muted">接单 <span style="color:#514465">${p.orders}</span></span></div><div class="tags"><span class="tag">${p.tags[0]}</span><span class="tag blue">${p.tags[1]}</span></div><div class="between"><span>${price(p.price,'局')}</span><span class="mini-cta">下单</span></div></button>`).join(''):`<div class="empty card">${icon('search')}暂时没有匹配的陪玩<br><span class="small">换个游戏或昵称，再找找你的搭子吧</span><button class="secondary" data-action="clear-search">查看全部陪玩</button></div>`}
function serviceRows(inCheckout=false){const p=selectedPerson();return ['rank','fun'].map((type,i)=>`<button class="service ${state.service===type?'selected':''}" data-service="${type}" aria-pressed="${state.service===type}">${inCheckout?'<span class="radio" aria-hidden="true"></span>':''}<span class="service-icon">${icon(i?'game':'crown')}</span><span class="grow"><strong>${i?'娱乐陪玩':'排位上分'}${inCheckout?'<span>1局</span>':''}</strong><p>${i?'轻松开黑 · 快乐游戏':'快速上分 · 稳定可靠'}</p></span><span class="price"><small>¥</small>${i?p.fun:p.price}${!inCheckout?'<span class="unit">/局</span>':''}</span>${!inCheckout?`<span class="arrow-pill">${icon('next')}</span>`:''}</button>`).join('')}
function detail(){const p=selectedPerson();return `<section class="page detail-page"><div class="detail-hero"><div class="detail-art">${portrait(p)}</div><div class="hero-nav"><button class="round" data-go="home" aria-label="返回首页">${icon('back')}</button><button class="round" data-action="favorite" aria-label="${state.favorite?'取消收藏':'收藏陪玩'}" aria-pressed="${state.favorite}" id="favorite">${icon('heart')}</button></div><span class="hero-label">PLAYER / ${String(p.id+1).padStart(2,'0')}</span></div><section class="profile-card"><div class="flex">${avatar(p)}<div class="grow"><div class="between"><h2 id="page-title" tabindex="-1">${p.name} ${verified()}</h2><span class="online">在线</span></div><p>${p.game} · ${p.rank}</p></div></div><div class="stats"><div class="rating">${icon('star')}<b>${p.rating}</b><span class="stars">★★★★★</span></div><div class="stat"><span>服务</span><b>2.3万单</b></div><div class="stat"><span>好评率</span><b>99%</b></div></div></section><div class="page-pad"><h3 class="section-title">擅长位置</h3><div class="roles">${p.roles.map((r,i)=>`<span class="tag ${['purple','blue','orange'][i]}">${icon(['leaf','sword','shield'][i])}${r}</span>`).join('')}</div><h3 class="section-title">服务与价格</h3><div class="service-list">${serviceRows()}</div><button class="voice" data-action="voice" aria-label="播放语音试听演示" aria-pressed="false"><span class="voice-play" id="voice-play">${icon('play')}</span><span class="wave" id="voice-wave" aria-hidden="true">${Array.from({length:23},(_,i)=>`<i style="height:${[10,18,28,38,24,13,29,19,11,27,36,22,15,30,40,29,14,23,31,16,9,18,25][i]}px;--n:${i}"></i>`).join('')}</span><span class="voice-meta">语音试听 · 演示<br><b id="voice-time">0:18</b></span></button><p class="small muted" style="font-size:10px;text-align:right;margin:5px 3px 0">仅演示播放交互，不含真人录音</p><h3 class="section-title" style="margin-top:11px">个人介绍</h3><p class="bio">${esc(p.bio).replace(/\n/g,'<br>')}</p></div><footer class="detail-bottom flex"><span>${price(amount(),'局')}</span><button class="primary" data-go="checkout">立即预约</button></footer></section>`}
function checkout(){const p=selectedPerson();return `<section class="page checkout-page">${header('确认订单','detail')}<div class="page-pad"><button class="person-summary card flex" data-go="detail" aria-label="返回${p.name}的详情">${avatar(p)}<div class="grow"><h3>${p.name} · ${p.game}</h3><span class="online">在线</span></div>${icon('next')}</button><h3 class="section-title">选择服务</h3><div class="checkout-services">${serviceRows(true)}</div><div class="form-card card"><label class="form-line">${icon('calendar')}<strong>预约时间</strong><select id="appointment" aria-label="预约时间">${['立即开局','今天 21:00','今天 22:00','明天 20:00'].map(t=>`<option ${state.time===t?'selected':''}>${t}</option>`).join('')}</select>${icon('next','chevron')}</label><button class="form-line" data-action="coupon">${icon('ticket')}<strong>优惠券</strong><span class="coupon-badge">${state.coupon?'-¥'+state.coupon:'不使用'}</span>${icon('next','chevron')}</button></div><div class="note-card card"><div class="note-wrap"><label class="screen-reader" for="note">给陪玩留言，最多100字</label><textarea id="note" maxlength="100" placeholder="备注：给陪玩留言（选填）">${esc(state.note)}</textarea><div class="note-count"><span id="note-length">${state.note.length}</span>/100</div></div></div><div class="bill card"><div class="bill-row"><span>商品金额</span><span>¥${amount()}</span></div><div class="bill-row"><span>服务费</span><span>¥0</span></div><div class="bill-row discount"><span>优惠</span><span>- ¥${state.coupon}</span></div><div class="bill-total"><strong>合计</strong><span class="price gradient-text"><small>¥</small>${total()}</span></div></div></div><footer class="checkout-bottom"><div class="flex"><strong>实付 ${price(total())}</strong><button class="primary" data-action="pay">确认支付</button></div><p class="small">模拟支付，不会扣款 · 开场 5 分钟内可免费取消（演示）</p></footer></section>`}
function orders(){const o=state.order;const show=o&&(state.tab==='全部'||state.tab===o.status);return `<section class="page" style="padding-bottom:0">${header('我的订单')}<div class="page-pad"><nav class="order-tabs" aria-label="订单状态筛选">${['全部','待服务','进行中','已完成'].map(t=>`<button class="order-tab ${state.tab===t?'active':''}" data-tab="${t}" aria-pressed="${state.tab===t}">${t}</button>`).join('')}</nav>${show?orderContent(o):`<div class="empty card">${icon('orders')}<h3>${o?'暂无'+state.tab+'订单':'还没有开启的快乐旅程'}</h3><p class="small">${o?'换个分类，看看其他订单吧':'挑一位合拍的陪玩，一起出发吧'}</p><button class="primary" data-go="home">去找陪玩</button></div>`}</div>${nav('orders')}</section>`}
function orderContent(o){const p=people[o.person];const completed=o.status==='已完成',waiting=o.status==='待服务';return `${completed?`<section class="complete-order"><span class="check-circle">${icon('check')}</span><h2>服务完成</h2><p>这一局的快乐，下次继续！</p></section>`:`<section class="live-card"><span class="live-badge">${icon('game')}${waiting?'预约成功':'服务中'}</span><div class="countdown">${waiting?'预约':'还剩'} <b id="countdown" style="${waiting?'font-size:34px':''}">${waiting?esc(o.time):remaining()}</b></div><p>${waiting?'陪玩已确认预约，等待约定时间':'陪玩已接单，正在开黑'}</p><span class="live-wave" aria-hidden="true">${[13,27,48,66,38,57,26].map(h=>`<i style="height:${h}px"></i>`).join('')}</span></section><section class="chat-card card"><div class="chat-row">${avatar(p)}<div class="bubble">${waiting?'预约收到啦，期待一起开黑～':'老板好呀，随时可以开始～'}</div><time>21:03</time></div><div class="chat-row self"><time>21:04</time><div class="bubble">${waiting?'到时见':'开吧'}</div>${avatar(people[3])}</div><button class="primary" data-action="${waiting?'start':'room'}">${icon('game')}${waiting?'模拟开始服务':'进入游戏房间'}${icon('next')}</button><p class="order-caption">${p.name} · ${p.game} · ${o.service==='rank'?'排位上分':'娱乐陪玩'} 1局</p></section>`}<section class="review-card card"><div class="review-heading"><span class="check-circle">${icon(completed?'check':'star')}</span><h2>${o.reviewed?'感谢你的评价':completed?'服务完成':'服务评价'}</h2></div><p>${o.reviewed?'好评已保存在本次演示中':completed?'一起开黑的体验如何？':'完成服务后，就可以留下你的评价'}</p><div class="review-stars" aria-label="评分">${[1,2,3,4,5].map(i=>`<button class="star-btn ${i<=state.stars?'selected':''}" data-star="${i}" aria-label="${i}星" aria-pressed="${i===state.stars}" ${!completed||o.reviewed?'disabled':''}>${icon('star')}</button>`).join('')}</div><div class="review-tags">${['声音好听','技术好','很耐心'].map((t,i)=>`<button class="tag ${['','blue','purple'][i]} ${state.reviewTags.has(t)?'chosen':''}" data-review-tag="${t}" aria-pressed="${state.reviewTags.has(t)}" ${!completed||o.reviewed?'disabled':''}>${t}</button>`).join('')}</div><button class="primary" data-action="review" ${!completed||o.reviewed?'disabled':''}>${o.reviewed?'已提交评价':'提交评价'}</button>${!completed&&!waiting?'<button class="finish-button" data-action="finish">模拟完成服务，体验评价流程</button>':''}</section><div class="order-meta card"><div class="between"><b>${p.name} · ${p.game}</b><span>实付 ¥${o.paid}</span></div><div>订单编号：${o.id} · 本地演示</div>${o.note?`<div>预约备注：${esc(o.note)}</div>`:''}${waiting?'<button class="finish-button" data-action="cancel">取消本次模拟预约</button>':''}</div>`}
function remaining(){if(!state.order)return '24:36';const seconds=Math.max(0,Math.ceil((state.order.endsAt-Date.now())/1000));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function openDialog(title,body){const d=$('#dialog');d.innerHTML=`<button class="round dialog-close" data-action="close" aria-label="关闭弹窗">${icon('close')}</button><h2 id="dialog-title">${title}</h2>${body}`;d.showModal()}
function stopVoice(){clearInterval(voiceTimer);voiceTimer=null;state.voice=false;state.voiceSeconds=18}
function voice(){if(state.voice){stopVoice();updateVoice();return}state.voice=true;state.voiceSeconds=18;updateVoice();toast('正在演示试听动效，本原型不含真人录音');voiceTimer=setInterval(()=>{state.voiceSeconds--;if(state.voiceSeconds<=0)stopVoice();updateVoice()},1000)}
function updateVoice(){if(!$('#voice-time'))return;$('#voice-time').textContent='0:'+String(state.voiceSeconds).padStart(2,'0');$('#voice-play').innerHTML=icon(state.voice?'pause':'play');$('#voice-wave').classList.toggle('playing',state.voice);$('.voice').setAttribute('aria-pressed',String(state.voice));$('.voice').setAttribute('aria-label',state.voice?'停止试听演示':'播放语音试听演示')}
function pay(){if(state.order&&state.order.status!=='已完成'){openDialog('已有未完成订单','<p>本原型一次体验一笔订单。请先完成或取消当前模拟订单，再预约新的陪玩。</p><button class="primary" data-action="view-order">查看当前订单</button>');return}state.order={id:'PW'+Date.now().toString().slice(-10),person:state.person,service:state.service,paid:total(),coupon:state.coupon,time:state.time,note:state.note,status:state.time==='立即开局'?'进行中':'待服务',endsAt:Date.now()+1476000,reviewed:false};state.stars=5;state.reviewTags=new Set(['声音好听','技术好','很耐心']);state.tab=state.order.status;go('orders');toast('模拟支付成功，未发生真实扣款')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.go){if(b.dataset.go==='checkout'&&state.page!=='checkout')state.note=state.note||'';go(b.dataset.go);return}
 if(b.dataset.person!==undefined){state.person=Number(b.dataset.person);state.service='rank';state.favorite=false;go('detail');return}
 if(b.dataset.category){state.category=b.dataset.category;render();return}
 if(b.dataset.service){state.service=b.dataset.service;stopVoice();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.tab){state.tab=b.dataset.tab;render();return}
 if(b.dataset.discount!==undefined){state.coupon=Number(b.dataset.discount);$('#dialog').close();render();return}
 if(b.dataset.star){state.stars=Number(b.dataset.star);const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.reviewTag){const t=b.dataset.reviewTag;state.reviewTags.has(t)?state.reviewTags.delete(t):state.reviewTags.add(t);b.classList.toggle('chosen',state.reviewTags.has(t));b.setAttribute('aria-pressed',String(state.reviewTags.has(t)));return}
 switch(b.dataset.action){
 case 'close':$('#dialog').close();break;
 case 'clear-search':state.category='全部';state.search='';render();break;
 case 'claim':if(state.claimed){toast('新人券已在你的优惠券中');break}state.claimed=true;state.coupon=10;render();toast('已领取新人 ¥10 优惠券，预约时自动抵扣');break;
 case 'rank':openDialog('本周人气榜',`<p>高人气搭子，好评与实力都在线。</p>${people.slice(0,3).map((p,i)=>`<div class="coupon-option"><span>${i+1}. ${p.name}<small>${p.game} · ${p.heat}热度</small></span><b style="font-size:18px">★ ${p.rating}</b></div>`).join('')}<p>榜单数据为静态演示。</p>`);break;
 case 'notifications':openDialog('消息通知','<div class="dialog-icon">'+icon('bell')+'</div><p>欢迎来到一起开黑！新人首单可领 ¥10 优惠券，找到你的专属游戏搭子吧。</p><button class="primary" data-action="close">知道啦</button>');break;
 case 'favorite':state.favorite=!state.favorite;b.setAttribute('aria-pressed',String(state.favorite));b.setAttribute('aria-label',state.favorite?'取消收藏':'收藏陪玩');b.style.color=state.favorite?'#ff8cd7':'#fff';b.querySelector('svg').style.fill=state.favorite?'currentColor':'none';toast(state.favorite?'已收藏这位陪玩（本次演示）':'已取消收藏');break;
 case 'voice':voice();break;
 case 'coupon':openDialog('选择优惠券',`<p>每笔订单限用一张，以下为演示优惠券。</p>${state.claimed?'<button class="coupon-option" data-discount="10"><span>新人首单券<small>无门槛 · 本次演示可用</small></span><b>-¥10</b></button>':''}<button class="coupon-option" data-discount="5"><span>开黑福利券<small>无门槛 · 本次演示可用</small></span><b>-¥5</b></button><button class="coupon-option" data-discount="0"><span>暂不使用优惠券</span><span>›</span></button>`);break;
 case 'pay':pay();break;
 case 'view-order':$('#dialog').close();state.tab=state.order.status;go('orders');break;
 case 'room':openDialog('一起开黑 · 游戏房间',`<p>${people[state.order.person].name}已就位，准备好一起拿下这一局了吗？</p><div class="room-code">882 106</div><p style="text-align:center">演示房间号 · 不会连接真实游戏或语音</p><button class="primary" data-action="join">${icon('game')}模拟加入房间</button>`);break;
 case 'join':$('#dialog').close();toast('已进入演示房间，祝你开黑愉快！');break;
 case 'start':state.order.status='进行中';state.order.endsAt=Date.now()+1476000;state.tab='进行中';render();toast('服务已开始（演示）');break;
 case 'finish':state.order.status='已完成';state.tab='已完成';render();toast('服务已完成，来给搭子一个好评吧');break;
 case 'review':if(state.order?.status!=='已完成'||state.order.reviewed)return;state.order.reviewed=true;state.order.review={stars:state.stars,tags:[...state.reviewTags]};render();toast(`已提交 ${state.stars} 星评价，感谢你的反馈`);break;
 case 'cancel':openDialog('取消模拟预约','<p>确认取消这笔演示订单吗？本原型没有真实扣款，也不会产生退款。</p><button class="primary" data-action="confirm-cancel">确认取消预约</button>');break;
 case 'confirm-cancel':state.order=null;$('#dialog').close();render();toast('模拟预约已取消');break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value.trim();$('#companions').innerHTML=companionCards()}if(e.target.id==='note'){state.note=e.target.value;$('#note-length').textContent=state.note.length}});
document.addEventListener('change',e=>{if(e.target.id==='appointment')state.time=e.target.value});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
window.addEventListener('popstate',()=>{const page=location.hash.slice(1);go(['home','detail','checkout','orders'].includes(page)?page:'home',false)});
setInterval(()=>{if(state.order?.status==='进行中'){if(state.order.endsAt<=Date.now()){state.order.status='已完成';state.tab='已完成';if(state.page==='orders')render()}else if($('#countdown'))$('#countdown').textContent=remaining()}},1000);
const initial=location.hash.slice(1);state.page=['home','detail','checkout','orders'].includes(initial)?initial:'home';history.replaceState({page:state.page},'', '#'+state.page);render();
</script>
</body>
</html>
